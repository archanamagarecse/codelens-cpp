<script>
const T=[
{n:"Simple Statements",s:"variables, input, output",i:"A C++ program is a sequence of statements ending in a semicolon. Declaration, assignment, input (cin) and output (cout) are the simplest ones.",
c:["int a = 5, b = 2;","float avg;","cin >> a;","avg = (a + b) / 2.0;","cout << avg;"],
st:[[0,"Declaration with initialisation: two int variables are created.",[["a","5"],["b","2"]]],
[1,"avg is declared but not initialised, so it holds a garbage value.",[["a","5"],["b","2"],["avg","garbage"]]],
[2,"cin >> a reads from the keyboard. Suppose the user types 8.",[["a","8"],["b","2"],["avg","garbage"]]],
[3,"Assignment: right side is evaluated first. 2.0 makes it floating-point division, so (8+2)/2.0 = 5.",[["a","8"],["b","2"],["avg","5"]]],
[4,"cout << avg sends the value to the screen.",[["a","8"],["b","2"],["avg","5"],["console","5"]]]],
k:["Every statement ends with ;","Initialise variables when you declare them.","cin >> uses extraction, cout << uses insertion.","int / int gives int; use 2.0 for real division."],
q:["What is 5 / 2 in C++ when both are int?","2.5","2","3",1,"Integer division truncates the fraction, so the result is 2."]},
{n:"1. Simple if",s:"decision making",i:"The simplest decision: run a block only when the condition is true. If it is false, the block is skipped and the program continues after it.",
c:["int age = 20;","if (age >= 18) {","  cout << \"Eligible\";","}","cout << \"Done\";"],
st:[[0,"age is 20.",[["age","20"]]],
[1,"Condition 20 >= 18 is evaluated. Result: true, so enter the block.",[["age","20"],["condition","true"]]],
[2,"Block body runs.",[["age","20"],["console","Eligible"]]],
[4,"Code after the if always runs. If age were 15, line 2 would be skipped and only Done printed.",[["age","20"],["console","Eligible, Done"]]]],
k:["Syntax: if (condition) { statements }","Any non-zero value counts as true.","No semicolon after if (...)","Braces are optional for one statement, but use them."],
q:["If the condition is false in a simple if, what happens?","Error","The block is skipped",
"The block runs once",1,"Control jumps to the first statement after the block."]},
{n:"2. if-else",s:"decision making",i:"Two-way choice: exactly one of the two blocks runs. The else block runs when the condition is false.",
c:["int n = 7;","if (n % 2 == 0) {","  cout << \"Even\";","} else {","  cout << \"Odd\";","}"],
st:[[0,"n is 7.",[["n","7"]]],
[1,"7 % 2 gives 1, and 1 == 0 is false.",[["n % 2","1"],["condition","false"]]],
[3,"Condition false, so the if block is skipped and control jumps to else.",[["path","else"]]],
[4,"The else block runs.",[["console","Odd"]]]],
k:["Exactly one block executes.","else has no condition.","Ternary shortcut: (n%2==0) ? \"Even\" : \"Odd\"","else belongs to the nearest unmatched if."],
q:["How many blocks run in an if-else?","Both","Exactly one","None",1,"Either the if block or the else block runs, never both."]},
{n:"3. else-if Ladder",s:"decision making",i:"For more than two outcomes, chain conditions. They are tested top to bottom and the first true one wins; the rest are skipped.",
c:["int m = 72;","if (m >= 90) cout << \"A\";","else if (m >= 75) cout << \"B\";","else if (m >= 60) cout << \"C\";","else cout << \"F\";"],
st:[[0,"m is 72.",[["m","72"]]],
[1,"72 >= 90 is false. Go to the next test.",[["test","m >= 90"],["result","false"]]],
[2,"72 >= 75 is false. Go to the next test.",[["test","m >= 75"],["result","false"]]],
[3,"72 >= 60 is true. Print C. The final else is skipped.",[["test","m >= 60"],["result","true"],["console","C"]]]],
k:["Order matters: put the most restrictive condition first.","Final else is the default case.","Only one branch ever runs.","Testing m >= 60 first would wrongly give C to 95."],
q:["If m = 95 and the order is reversed (m>=60 first), what prints?","A","The 60 branch (wrong grade)","F",1,"The first true condition wins, so order matters."]},
{n:"4. Nested if",s:"decision making",i:"An if inside another if. The inner condition is checked only when the outer condition is true.",
c:["int age = 25, hasId = 1;","if (age >= 18) {","  if (hasId) {","    cout << \"Enter\";","  } else {","    cout << \"Show ID\";","  }","} else {","  cout << \"Too young\";","}"],
st:[[0,"age = 25, hasId = 1.",[["age","25"],["hasId","1"]]],
[1,"Outer condition 25 >= 18 is true, so enter the outer block.",[["outer","true"]]],
[2,"Inner condition hasId (1) is true.",[["outer","true"],["inner","true"]]],
[3,"Both true, so Enter is printed.",[["console","Enter"]]],
[5,"If hasId were 0, this line would print Show ID. If age < 18, line 8 would print Too young.",[["other paths","Show ID / Too young"]]]],
k:["Inner if is evaluated only if outer is true.","Indent carefully to keep it readable.","Often replaceable by &&: if (age>=18 && hasId)","Avoid more than 2-3 levels of nesting."],
q:["When is the inner if evaluated?","Always","Only if the outer condition is true","Only if outer is false",1,"The inner statement is part of the outer block."]},
{n:"5. switch",s:"decision making",i:"switch selects one of many fixed values of an int/char/enum. It is cleaner than a long else-if ladder for equality checks.",
c:["int day = 3;","switch (day) {","  case 1: cout << \"Mon\"; break;","  case 3: cout << \"Wed\"; break;","  default: cout << \"Other\";","}"],
st:[[0,"day is 3.",[["day","3"]]],
[1,"The switch expression is evaluated once.",[["switch value","3"]]],
[2,"case 1: does 3 equal 1? No, move on.",[["case 1","no match"]]],
[3,"case 3: matches. Run its statements.",[["case 3","match"],["console","Wed"]]],
[3,"break exits the switch. Without break, execution would fall through into the next case.",[["after break","exit switch"]]],
[4,"default runs only if no case matches (for example day = 9).",[["default","not run"]]]],
k:["Case labels must be constant integers or characters.","break prevents fall-through.","default is optional but recommended.","Cannot use ranges or float/string values."],
q:["Which type can NOT be used in a switch?","char","float","enum",1,"switch needs integral types (int, char, enum)."]},
{n:"6. while Loop",s:"loops",i:"An entry-controlled loop: the condition is checked BEFORE every iteration. If it is false at the start, the body never runs.",
c:["int i = 1, sum = 0;","while (i <= 3) {","  sum += i;","  i++;","}","cout << sum;"],
st:[[0,"Initialise the counter and accumulator.",[["i","1"],["sum","0"]]],
[1,"Check 1 <= 3: true, so enter the body.",[["i","1"],["sum","0"],["check","true"]]],
[3,"Body: sum = 0 + 1 = 1, then i becomes 2.",[["i","2"],["sum","1"]]],
[1,"Check 2 <= 3: true.",[["i","2"],["sum","1"],["check","true"]]],
[3,"Body: sum = 3, i = 3.",[["i","3"],["sum","3"]]],
[1,"Check 3 <= 3: true.",[["i","3"],["sum","3"],["check","true"]]],
[3,"Body: sum = 6, i = 4.",[["i","4"],["sum","6"]]],
[1,"Check 4 <= 3: false, so exit the loop.",[["i","4"],["sum","6"],["check","false"]]],
[5,"Print the result.",[["console","6"]]]],
k:["Initialise before, update inside the body.","Forgetting i++ gives an infinite loop.","May execute zero times.","Use when the iteration count is unknown."],
q:["How many times does while (false) { } run its body?","Once","Zero","Infinite",1,"The condition is checked first, so the body never runs."]},
{n:"7. do-while Loop",s:"loops",i:"An exit-controlled loop: the body runs first, then the condition is checked. So it always runs at least once.",
c:["int n = 10;","do {","  cout << n;","  n++;","} while (n < 5);"],
st:[[0,"n is 10, already not less than 5.",[["n","10"]]],
[1,"Enter the body without checking anything first.",[["check","not yet"]]],
[2,"Prints the value.",[["n","10"],["console","10"]]],
[3,"n becomes 11.",[["n","11"]]],
[4,"Now check 11 < 5: false, so the loop ends. A while loop would have run 0 times here.",[["check","false"],["iterations","1"]]]],
k:["Ends with a semicolon after while(...);","Good for menus and input validation.","Guaranteed at least one iteration."],
q:["Minimum number of executions of a do-while body?","0","1","2",1,"The condition is tested after the body."]},
{n:"8. for Loop",s:"loops",i:"Packs initialisation, condition and update in one line. Best when the number of iterations is known.",
c:["for (int i = 0; i < 3; i++) {","  cout << i;","}","cout << \"end\";"],
st:[[0,"Init runs once (i = 0), then the condition 0 < 3 is checked: true.",[["i","0"],["check","true"]]],
[1,"Body prints 0.",[["i","0"],["console","0"]]],
[0,"Update i++ makes i = 1. Check 1 < 3: true.",[["i","1"],["check","true"]]],
[1,"Body prints 1.",[["i","1"],["console","0 1"]]],
[0,"Update: i = 2. Check 2 < 3: true.",[["i","2"],["check","true"]]],
[1,"Body prints 2.",[["i","2"],["console","0 1 2"]]],
[0,"Update: i = 3. Check 3 < 3: false, so exit.",[["i","3"],["check","false"]]],
[3,"Execution continues after the loop.",[["console","0 1 2 end"]]]],
k:["Order: init, then condition, body, update, condition...","i is local to the loop when declared inside for(...).","Nested for loops are used for 2D patterns and matrices.","Range-for: for (int x : arr)"],
q:["In for(int i=0;i<3;i++), how many times does the body run?","2","3","4",1,"i takes values 0, 1 and 2."]},
{n:"Operators",s:"arithmetic, logical, bitwise",i:"Operators act on operands to produce values. Know their meaning, precedence and the difference between prefix and postfix forms.",
c:["int a = 7, b = 2;","int d = a / b;","int r = a % b;","int x = a++;","int y = ++b;","bool t = (a > b) && (b != 0);","int z = a & b;"],
st:[[0,"a = 7 and b = 2.",[["a","7"],["b","2"]]],
[1,"Integer division: 7 / 2 = 3.",[["a","7"],["b","2"],["d","3"]]],
[2,"Modulus gives the remainder: 7 % 2 = 1.",[["a","7"],["b","2"],["d","3"],["r","1"]]],
[3,"Postfix: x gets the OLD value 7, then a becomes 8.",[["a","8"],["b","2"],["x","7"]]],
[4,"Prefix: b is incremented first to 3, then y gets 3.",[["a","8"],["b","3"],["x","7"],["y","3"]]],
[5,"Relational and logical: (8 > 3) is true AND (3 != 0) is true, so t = 1. && stops early if the left side is false.",[["a","8"],["b","3"],["t","1 (true)"]]],
[6,"Bitwise AND: 1000 & 0011 = 0000, so z = 0.",[["a (binary)","1000"],["b (binary)","0011"],["z","0"]]]],
k:["Logical: && || !  Bitwise: & | ^ ~ << >>","Precedence: * / % before + -, then relational, then &&, then ||.","Postfix returns old value, prefix returns new value.","Avoid modifying a variable twice in one expression."],
q:["After int x = a++; with a = 7, what are x and a?","x=7, a=8","x=8, a=8","x=7, a=7",0,"Postfix uses the old value (7) first and then increments a to 8."]},
{n:"Increment & Decrement",s:"prefix vs postfix",i:"++ adds 1 and -- subtracts 1. Prefix (++a) changes the variable first and then gives the NEW value. Postfix (a++) gives the OLD value first and then changes the variable.",
c:["int a = 5;","int b = a++;","int c = ++a;","int d = a--;","int e = --a;"],
st:[[0,"a is 5.",[["a","5"]]],
[1,"Postfix: b takes the old value 5, then a becomes 6.",[["a","6"],["b","5"]]],
[2,"Prefix: a becomes 7 first, then c takes 7.",[["a","7"],["b","5"],["c","7"]]],
[3,"Postfix decrement: d takes old value 7, then a becomes 6.",[["a","6"],["b","5"],["c","7"],["d","7"]]],
[4,"Prefix decrement: a becomes 5 first, then e takes 5.",[["a","5"],["b","5"],["c","7"],["d","7"],["e","5"]]]],
k:["Alone on a line (a++; or ++a;) both behave the same.","Difference appears only when the value is used in an expression.","Never modify the same variable twice in one expression: result is undefined (e.g. i++ + ++i).","Prefix is slightly faster for iterators and class objects."],
q:["int a = 5; int b = a++; What are a and b?","a=6, b=5","a=5, b=6","a=6, b=6",0,"Postfix gives the old value (5) to b and then increments a to 6."]},
{n:"Brain Gym 1",s:"increment / decrement",i:"Practice challenge. Trace each statement carefully. Question: what is printed?",
c:["int x = 3, y = 4, z;","z = x++ + y--;","z = z + ++x - --y;","cout << z;"],
st:[[0,"Start: x = 3, y = 4.",[["x","3"],["y","4"]]],
[1,"x++ contributes the old 3 and y-- the old 4. z = 3 + 4 = 7. After the statement x = 4, y = 3.",[["x","4"],["y","3"],["z","7"]]],
[2,"++x makes x = 5 and gives 5. --y makes y = 2 and gives 2. z = 7 + 5 - 2 = 10.",[["x","5"],["y","2"],["z","10"]]],

// Send login or progress data to Dr. Archana Magare's Google Sheet
async function sendToGoogleSheet(data) {
  const url = getSheetUrl();
  if (!url) {
    st("Saved on device (Google Sheet URL not configured yet)");
    return false;
  }
  st("Saving to Google Sheet...");
  try {
    await fetch(url, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(data)
    });
    const timeStr = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    st("✓ Saved to Google Sheet (" + timeStr + ")");
    return true;
  } catch (err) {
    console.error("Google Sheet save error:", err);
    st("Saved on device (sync error: check internet/sheet)");
    return false;
  }
}

function loginStudent(rollVal, nameVal) {
  const roll = (rollVal || "").trim().toUpperCase();
  const name = (nameVal || "").trim();
  if (!/^[A-Z0-9\/-]{3,25}$/.test(roll)) {
    alert("Please enter a valid Enrollment Number (3 to 25 characters, e.g. 21IT001).");
    return false;
  }
  if (!name || name.length < 2) {
    alert("Please enter the Student Name.");
    return false;
  }
  cloud.d.roll = roll;
  cloud.d.name = name;
  try {
    localStorage.setItem("cl_user_roll", roll);
    localStorage.setItem("cl_user_name", name);
    localStorage.setItem("cl_last_active", new Date().toISOString());
  } catch(e){}
  
  const loginPayload = {
    action: "STUDENT_LOGIN",
    enrollmentNo: roll,
    name: name,
    topicsCompleted: done.size,
    bestScore: lb(),
    totalTopics: T.length,
    weakTopics: Object.keys(weak).join(", ") || "None",
    timestamp: new Date().toLocaleString(),
    userAgent: navigator.userAgent
  };
  sendToGoogleSheet(loginPayload);
  acct();
  return true;
}
